name: Complete continuous research smoke
on:
  push:
    branches: [improve/epivra-optimization]
    paths: [evals/refactor-smoke-request.json]
permissions:
  contents: read
concurrency:
  group: small-live-eval-${{ github.repository }}
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.ref == 'refs/heads/improve/epivra-optimization'
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Isolated install and contract tests without model credentials
        shell: python
        run: |
          import os, subprocess, venv
          from pathlib import Path
          directory=Path(os.environ['RUNNER_TEMP'])/('epivra-refactor-smoke-'+os.environ['GITHUB_RUN_ID'])
          directory.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              output.write('SMOKE_TEMP='+str(directory)+'\n')
              output.write('SMOKE_PYTHON='+str(directory/'env/Scripts/python.exe')+'\n')
          venv.EnvBuilder(with_pip=True).create(directory/'env')
          python=str(directory/'env/Scripts/python.exe')
          subprocess.run([python,'-m','pip','install','.','ruff'],check=True,timeout=480)
          subprocess.run([python,'-m','ruff','check','tools/run_refactor_smoke.py','tests/test_refactor_smoke.py'],check=True)
          subprocess.run([python,'-m','unittest','discover','-s','tests','-p','test_refactor_smoke.py','-v'],check=True)
          subprocess.run([python,'-m','unittest','discover','-s','tests','-p','test_research_workspace.py'],check=True)
      - name: Run one complete task from route to independent edit and publication
        shell: python
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          import os, subprocess, sys
          result=subprocess.run([os.environ['SMOKE_PYTHON'],'tools/run_refactor_smoke.py','--run-id','gh-'+os.environ['GITHUB_RUN_ID']])
          sys.exit(result.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: continuous-research-smoke-${{ github.run_id }}
          path: artifacts/workspace-smoke/
          retention-days: 30
          if-no-files-found: warn
      - name: Cleanup only this task's private state
        if: always() && env.SMOKE_TEMP != ''
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          shutil.rmtree(os.environ['SMOKE_TEMP'],ignore_errors=True)
          shutil.rmtree(Path('.epivra')/('workspace-smoke-gh-'+os.environ['GITHUB_RUN_ID']),ignore_errors=True)
