name: Self-hosted fast validation

on:
  push:
    branches: [improve/epivra-optimization]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'evals/**'
      - '!evals/live-request.json'
      - '!evals/open-web-request.json'
      - '!evals/read-delivery-request.json'
      - 'pyproject.toml'
      - '.github/workflows/self-hosted-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-fast-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create isolated fast environment
        id: env
        shell: powershell
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "epivra-fast-$env:GITHUB_RUN_ID"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install ".[mcp]" ruff mypy build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "venv=$venv" >> $env:GITHUB_OUTPUT
          "python=$python" >> $env:GITHUB_OUTPUT

      - name: Run fast regression suite
        shell: powershell
        run: |
          $python = "${{ steps.env.outputs.python }}"
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python tools/check_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m ruff check src tests tools evals
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m mypy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m build --wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $venv = "${{ steps.env.outputs.venv }}"
          if ($venv) { Remove-Item -Recurse -Force $venv -ErrorAction SilentlyContinue }
