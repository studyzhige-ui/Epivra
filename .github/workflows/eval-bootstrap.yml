name: Evaluation source snapshot
on:
  push:
    branches: [improve/live-validation-20260919]
    paths: [.github/workflows/eval-bootstrap.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source only (no credentials or runtime state)
        run: git archive --format=tar HEAD -o source-snapshot.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-snapshot-${{ github.sha }}
          path: source-snapshot.tar
          retention-days: 3
          if-no-files-found: error
