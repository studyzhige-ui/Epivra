name: Complete fixed-source read-delivery comparison
on:
  push:
    branches: [improve/epivra-optimization]
    paths: [evals/read-delivery-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: small-live-eval-${{ github.repository }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9492635771460b7d312cb06541748b13379e9471
          path: .baseline
          persist-credentials: false
      - name: Retrieve exact existing official-source snapshots before any paid call
        shell: python
        env:
          ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          import hashlib, os, urllib.error, urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          request = urllib.request.Request('https://api.github.com/repos/studyzhige-ui/Epivra/actions/artifacts/10588969892/zip', headers={'Authorization': 'Bearer '+os.environ['ARTIFACT_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              response = urllib.request.build_opener(NoRedirect).open(request, timeout=30)
          except urllib.error.HTTPError as error:
              if error.code != 302: raise
              location = error.headers['Location']
              if urlsplit(location).scheme != 'https': raise ValueError('unsafe artifact redirect')
              # Never forward the GitHub credential to the signed storage host.
              response = urllib.request.urlopen(location, timeout=60)
          with response: data = response.read()
          if hashlib.sha256(data).hexdigest() != '05830b66f85ddd85f3c98ce4cd00a4a508739af337c55fb0ed3a9f4b88f5ca7e': raise ValueError('source artifact changed')
          archive = Path(os.environ['RUNNER_TEMP']) / ('epivra-delivery-fixture-'+os.environ['GITHUB_RUN_ID']+'-${{ matrix.arm }}.zip')
          archive.write_bytes(data)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output: output.write('EVAL_ARCHIVE='+str(archive)+'\n')
      - name: Isolated install and offline gates without provider keys
        shell: python
        run: |
          import os, subprocess, venv
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / ('epivra-delivery-eval-'+os.environ['GITHUB_RUN_ID']+'-${{ matrix.arm }}')
          venv.EnvBuilder(with_pip=True).create(folder)
          python = str(folder/'Scripts/python.exe')
          subprocess.run([python,'-m','pip','install','.'],check=True)
          subprocess.run([python,'-m','unittest','discover','-s','tests','-p','test_read_delivery*.py'],check=True)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output: output.write('EVAL_PYTHON='+python+'\n')
      - name: Complete autonomous ResearchService from plan to publication
        shell: python
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: ${{ matrix.arm == 'baseline' && format('{0}/.baseline/src', github.workspace) || format('{0}/src', github.workspace) }}
        run: |
          import os, subprocess, sys
          result = subprocess.run([os.environ['EVAL_PYTHON'],'tools/run_read_delivery_eval.py','--arm','${{ matrix.arm }}','--run-id','gh-'+os.environ['GITHUB_RUN_ID'],'--archive',os.environ['EVAL_ARCHIVE']])
          sys.exit(result.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: read-delivery-${{ matrix.arm }}-${{ github.run_id }}
          path: artifacts/delivery-${{ matrix.arm }}/
          retention-days: 7
          if-no-files-found: warn
      - name: Clean only this arm's private state and temporary inputs
        if: always()
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          run = os.environ['GITHUB_RUN_ID']
          temporary = Path(os.environ['RUNNER_TEMP'])
          shutil.rmtree(temporary/('epivra-delivery-eval-'+run+'-${{ matrix.arm }}'),ignore_errors=True)
          (temporary/('epivra-delivery-fixture-'+run+'-${{ matrix.arm }}.zip')).unlink(missing_ok=True)
          shutil.rmtree(Path('.epivra')/('delivery-gh-'+run+'-${{ matrix.arm }}'),ignore_errors=True)
