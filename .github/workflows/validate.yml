name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13', '3.14']
        extra: ['', '[mcp]']
        include:
          - os: ubuntu-latest
            python: '3.13'
            extra: '[documents,mcp]'
          - os: windows-latest
            python: '3.13'
            extra: '[documents,mcp]'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".${{ matrix.extra }}" ruff mypy build
      - run: python -m unittest discover -s tests
      - run: python tools/check_architecture.py
      - run: ruff check src tests tools evals
      - run: mypy
      - run: python -m build --wheel
