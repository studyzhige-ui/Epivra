name: Paired read-contract evaluation
on:
  workflow_dispatch:
  push:
    branches: [improve/read-contracts-20260919]
    paths: [evals/read-contract-request.json]
permissions:
  contents: read
concurrency:
  group: paired-read-contract-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 96968e399832aea53e016434841fa9be52d48fb5
          path: .baseline
          persist-credentials: false
      - name: Install and test without provider credentials
        run: |
          python -m pip install . ruff
          ruff check src tests tools evals
          python -m unittest discover -s tests -p 'test_read_contracts*.py'
      - name: Run one fixed small interface suite (not a full research benchmark)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: ${{ matrix.arm == 'baseline' && format('{0}/.baseline/src', github.workspace) || format('{0}/src', github.workspace) }}
        run: python tools/run_read_contract_eval.py --run-id gh-${{ github.run_id }} --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: read-contract-${{ matrix.arm }}-${{ github.run_id }}
          path: artifacts/read-contract-${{ matrix.arm }}/
          if-no-files-found: warn
          retention-days: 7
