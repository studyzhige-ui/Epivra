name: Self-hosted runner smoke

on:
  push:
    branches: [improve/epivra-optimization]
    paths: [.github/workflows/self-hosted-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-smoke-${{ github.repository }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 5
    steps:
      - name: Verify runner identity and basic tools
        shell: powershell
        run: |
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner OS:   $env:RUNNER_OS"
          Write-Host "Runner arch: $env:RUNNER_ARCH"
          Write-Host "Workspace:   $env:GITHUB_WORKSPACE"
          git --version
          if (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          } else {
            Write-Host "Python is not currently on PATH; smoke does not fail for that."
          }
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            docker version --format "Docker client={{.Client.Version}} server={{.Server.Version}}"
          } else {
            Write-Host "Docker is not currently on PATH; smoke does not fail for that."
          }

      - name: Checkout optimization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify checkout
        shell: powershell
        run: |
          $sha = git rev-parse HEAD
          Write-Host "Checked out $sha"
          if (-not (Test-Path "pyproject.toml")) {
            throw "Repository checkout is incomplete"
          }
          Write-Host "Self-hosted runner smoke passed."
