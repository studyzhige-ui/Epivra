name: One-off audited branch cleanup

on:
  push:
    branches: [improve/epivra-optimization]
    paths: [.github/workflows/cleanup-old-branches.yml]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 5
    steps:
      - name: Verify audited refs and delete only the approved branches
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = "studyzhige-ui/Epivra"
          keep = {"main", "improve/epivra-optimization"}
          expected = {
              "chore/archive-public-evidence-20260919": "e772357d0df62ee72015c52538011dd2d7af9754",
              "chore/prepare-read-contracts-20260919": "9599513fa0f06a1fb862a11a0ebd71bec47ee153",
              "chore/prepare-read-type-20260919": "62cfbb9c87b3cb47f38b706d37f682332b170792",
              "chore/prepare-report-receipt-20260919": "a91606e3ed99c24864274a63063221fe090d86aa",
              "chore/secret-smoke-20260919": "ec0819f2590e2cb24baf1bae2c370be7fdbc6c9b",
              "chore/verify-audit-provenance-20260919": "aef0931e4160d85bb0bed4ea4e477b344f952ca6",
              "codex/research-runtime-hardening": "adbcd426cfcc0bfc3e9b8d4815d81d5ed1de9200",
              "experiment/objective-led-research-20260920": "b0302503eefb6d9b25d8e715739b54a23dcbb0c2",
              "experiment/review-decision-20260920": "cbba57dab549e4bb5b009452f8cc2056e1f198bd",
              "improve/live-validation-20260919": "96968e399832aea53e016434841fa9be52d48fb5",
              "improve/read-contracts-20260919": "b3f45e5691f56b22362a3cba41e9a34f76a3761b",
              "stage/agent-capabilities-20260920": "3a17186510057e1f3ac69ae0b7b42906e6ca1a7a",
              "stage/read-delivery-20260920": "f6542a435e820ea0e4a8f9cddc8cd3567d8a46dd",
          }
          if keep & expected.keys():
              raise SystemExit("cleanup allow-list overlaps protected long-lived branches")

          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path, method="GET"):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read()
                      return json.loads(data) if data else None
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  raise RuntimeError(f"{method} {path}: HTTP {error.code}: {body}") from error

          # PRs with historical heads must already be closed.
          for number in (2, 3):
              pr = api(f"/pulls/{number}")
              if pr["state"] != "closed":
                  raise SystemExit(f"PR #{number} is still open; refusing cleanup")

          # Phase 1: verify every audited branch before deleting any branch.
          verified = []
          for branch, sha in expected.items():
              encoded = urllib.parse.quote(branch, safe="")
              ref = api("/git/ref/heads/" + encoded)
              actual = ref["object"]["sha"]
              if actual != sha:
                  raise SystemExit(
                      f"{branch} moved since audit: expected {sha}, got {actual}; refusing all deletion"
                  )
              verified.append(branch)

          # Phase 2: delete only the exact verified allow-list.
          for branch in verified:
              encoded = urllib.parse.quote(branch, safe="")
              api("/git/refs/heads/" + encoded, method="DELETE")
              print("deleted", branch)

          print("deleted_count", len(verified))
