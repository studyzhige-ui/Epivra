name: Small complete online research
on:
  push:
    branches: [improve/epivra-optimization]
    paths: [evals/open-web-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: small-live-eval-${{ github.repository }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install and test without provider credentials
        id: env
        shell: powershell
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "epivra-openweb-$env:GITHUB_RUN_ID"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install . ruff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m ruff check src tests tools evals
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s tests -p test_open_web_eval.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s tests -p test_live_eval.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "venv=$venv" >> $env:GITHUB_OUTPUT
          "python=$python" >> $env:GITHUB_OUTPUT

      - name: Execute one full small online task through the product service
        shell: powershell
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LIVE_RUN_ID: gh-${{ github.run_id }}
        run: |
          & "${{ steps.env.outputs.python }}" tools/run_open_web_eval.py --run-id "$env:LIVE_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarize operation timing
        if: always()
        shell: powershell
        run: |
          $python = "${{ steps.env.outputs.python }}"
          if (
            (Test-Path "artifacts\open-web\calls.json") -and
            (Test-Path "artifacts\open-web\summary.json") -and
            (Test-Path "tools\summarize_operation_timing.py")
          ) {
            & $python tools/summarize_operation_timing.py artifacts\open-web\calls.json --summary artifacts\open-web\summary.json --output artifacts\open-web\timing.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Timing inputs are unavailable; preserve the primary run evidence."
          }

      - name: Summarize exact repeated public reads
        if: always()
        shell: powershell
        run: |
          $python = "${{ steps.env.outputs.python }}"
          if (
            (Test-Path "artifacts\open-web\public-artifacts.json") -and
            (Test-Path "tools\summarize_read_redundancy.py")
          ) {
            & $python tools/summarize_read_redundancy.py artifacts\open-web\public-artifacts.json --output artifacts\open-web\read-redundancy.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Read diagnostic inputs are unavailable; preserve the primary run evidence."
          }

      - name: Export public evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/open-web/
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup private evaluation state
        if: always()
        shell: powershell
        run: |
          Remove-Item -Recurse -Force ".epivra\open-web-*" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "artifacts\open-web" -ErrorAction SilentlyContinue
          $venv = "${{ steps.env.outputs.venv }}"
          if ($venv) { Remove-Item -Recurse -Force $venv -ErrorAction SilentlyContinue }
