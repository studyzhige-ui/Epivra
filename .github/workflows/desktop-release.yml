name: Desktop release
run-name: Desktop ${{ inputs.source_ref || github.head_ref || github.ref_name }}
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag or commit to build (empty uses this ref)
        required: false
        type: string
      publish:
        description: Publish the verified artifacts
        type: boolean
        default: false
  push:
    tags: ['v0.3.*']
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ inputs.source_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
            name: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: python -m pip install -e ".[mcp]" build ruff mypy resvg-py pillow
      - name: Record source and validate tag
        id: source
        shell: python
        run: |
          import os, subprocess, tomllib
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("sha=" + sha + "\n")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              with open("pyproject.toml", "rb") as f:
                  version = tomllib.load(f)["project"]["version"]
              assert os.environ["GITHUB_REF_NAME"] == "v" + version
      - name: Validate source and offline behavior
        run: python tools/check_source.py
      - name: Build and verify built-in analysis
        run: python tools/build_analysis_bundle.py
      - name: Build and validate relocated native application
        run: python tools/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            dist/desktop/*.zip
            dist/desktop/*.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-publish-${{ needs.build.outputs.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, tomllib, zipfile
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag, sha = "v" + version, os.environ["BUILD_SHA"]
          repo = os.environ["GH_REPO"]
          path = pathlib.Path("release") / f"Epivra-{version}-windows-x64.zip"
          check = path.with_name(path.name + ".sha256")
          expected, name = check.read_text(encoding="utf-8").split()
          assert name == path.name, "Checksum names a different artifact"
          with path.open("rb") as stream:
              assert hashlib.file_digest(stream, "sha256").hexdigest() == expected, "Archive checksum mismatch"
          with zipfile.ZipFile(path) as bundle:
              build = json.loads(bundle.read(path.stem + "/BUILD.json"))
          assert build["version"] == version and build["commit"] == sha and build["dirty"] is False, "Build provenance mismatch"

          def api(endpoint):
              result = subprocess.run(["gh", "api", f"repos/{repo}/{endpoint}"], capture_output=True, text=True)
              if result.returncode:
                  if "(HTTP 404)" in result.stderr:
                      return None
                  raise RuntimeError(f"GitHub API failed: {endpoint}; {result.stderr}")
              return json.loads(result.stdout)

          tagged = api("commits/" + tag)
          assert tagged is None or tagged["sha"] == sha, "Existing version tag points to different source; use a new version"
          existing = api("releases/tags/" + tag)
          assert existing is None or tagged is not None, "Existing release has no source tag"
          if existing:
              subprocess.run(["gh", "release", "upload", tag, str(path), str(check), "--clobber", "--repo", repo], check=True)
              subprocess.run(["gh", "release", "edit", tag, "--latest", "--draft=false", "--prerelease=false", "--repo", repo], check=True)
          else:
              subprocess.run(["gh", "release", "create", tag, str(path), str(check), "--target", sha, "--latest", "--repo", repo,
                              "--title", "Epivra " + version + " — Desktop", "--notes-file", "packaging/RELEASE-NOTES.md"], check=True)
