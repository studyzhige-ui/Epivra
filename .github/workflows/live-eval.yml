name: Small live evaluation
on:
  push:
    branches: [improve/live-validation-20260919, 'eval/**']
    paths: [evals/live-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: small-live-eval-${{ github.repository }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install without provider credentials
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install .
      - name: Validate selection and offline export boundaries
        run: .venv/bin/python -m unittest discover -s tests -p test_live_eval.py -v
      - name: Run selected small paid checks (never Benchmark-10)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LIVE_RUN_ID: gh-${{ github.run_id }}
        run: .venv/bin/python tools/run_live_eval.py --run-id "$LIVE_RUN_ID"
      - name: Retain only explicit public diagnostic projections
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/live-eval/*.json
            artifacts/live-eval/report.md
          if-no-files-found: warn
          retention-days: 7
