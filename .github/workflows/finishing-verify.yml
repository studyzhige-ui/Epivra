name: Verify shared prompt and revision finishing pass
on:
  push:
    branches: [improve/epivra-optimization]
    paths: [.github/workflows/finishing-verify.yml]
permissions:
  contents: write
concurrency:
  group: finishing-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/improve/epivra-optimization'
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Materialize exact locally checked source
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          base='cf7691941e4986e872b31c8b6d79b0b6da8e2114'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==base
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          rows=json.loads(Path('.github/finishing-batch/manifest.json').read_text(encoding='utf-8'))
          for row in rows:
              if row['before']:
                  raw=subprocess.check_output(['git','show',base+':'+row['path']])
                  assert blob(raw)==row['before'],row['path']+' baseline'
                  Path(row['path']).write_bytes(raw)
          subprocess.run([sys.executable,'-X','utf8','.github/finishing-batch/apply.py'],check=True)
          Path('tests/test_prompt_finish.py').write_bytes(subprocess.check_output(['git','show','HEAD:.github/finishing-batch/test_prompt_finish.py']))
          for row in rows:
              p=Path(row['path']);data=p.read_bytes().replace(b'\r\n',b'\n')
              assert blob(data)==row['after'],row['path']+' candidate'
              compile(data,row['path'],'exec');p.write_bytes(data)
          d=Path(os.environ['RUNNER_TEMP'])/('epivra-finishing-'+os.environ['GITHUB_RUN_ID'])
          d.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:out.write('FINISH_ROOT='+str(d)+'\n')
      - name: Format and validate without provider keys
        id: gates
        shell: python
        run: |
          import ast, json, os, subprocess, venv
          from pathlib import Path
          d=Path(os.environ['FINISH_ROOT']);venv.EnvBuilder(with_pip=True).create(d/'env')
          p=str(d/'env/Scripts/python.exe')
          with (d/'install.log').open('wb') as log:subprocess.run([p,'-m','pip','install','.[mcp]','ruff','mypy','build'],stdout=log,stderr=subprocess.STDOUT,check=True,timeout=480)
          names=[r['path'] for r in json.loads(Path('.github/finishing-batch/manifest.json').read_text(encoding='utf-8'))]
          before={n:ast.dump(ast.parse(Path(n).read_text(encoding='utf-8')),include_attributes=False) for n in names}
          subprocess.run([p,'-m','ruff','format',*names],check=True)
          assert all(before[n]==ast.dump(ast.parse(Path(n).read_text(encoding='utf-8')),include_attributes=False) for n in names)
          subprocess.run([p,'-m','ruff','check','--fix',*names],check=True)
          subprocess.run([p,'tools/dev_check.py','run','--profile','full','--output',str(d/'evidence')],check=True)
          subprocess.run([p,'tools/dev_check.py','inspect','--output',str(d/'evidence')],check=True)
      - name: Export verified ordinary blobs without updating branches
        if: steps.gates.outcome == 'success'
        shell: python
        env:
          BLOB_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          result={}
          for row in json.loads(Path('.github/finishing-batch/manifest.json').read_text(encoding='utf-8')):
              data=Path(row['path']).read_bytes();sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/studyzhige-ui/Epivra/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['BLOB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response:actual=json.load(response)['sha']
              assert actual==sha;result[row['path']]=sha
          (Path(os.environ['FINISH_ROOT'])/'validated-blobs.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
      - name: Preserve exact candidate and logs
        if: always() && env.FINISH_ROOT != ''
        shell: python
        run: |
          import json, os
          from pathlib import Path
          d=Path(os.environ['FINISH_ROOT'])
          for row in json.loads(Path('.github/finishing-batch/manifest.json').read_text(encoding='utf-8')):
              target=d/'files'/row['path'];target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(Path(row['path']).read_bytes())
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.FINISH_ROOT != ''
        with:
          name: prompt-finishing-${{ github.run_id }}
          path: |
            ${{ env.FINISH_ROOT }}/evidence/
            ${{ env.FINISH_ROOT }}/*.json
            ${{ env.FINISH_ROOT }}/*.log
            ${{ env.FINISH_ROOT }}/files/
          retention-days: 14
          if-no-files-found: warn
      - name: Clean this verification environment
        if: always() && env.FINISH_ROOT != ''
        shell: python
        run: |
          import os, shutil
          shutil.rmtree(os.environ['FINISH_ROOT'],ignore_errors=True)
