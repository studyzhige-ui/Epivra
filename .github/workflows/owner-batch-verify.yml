name: Verify atomic continuous-owner source batch
on:
  push:
    branches: [improve/epivra-optimization]
    paths: [.github/workflows/owner-batch-verify.yml]
permissions:
  contents: write
concurrency:
  group: owner-batch-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/improve/epivra-optimization'
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Restore audited candidate and the exact local typing fix
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          base='08e54a544db587a3a12f8c8c8849a9bef7d02e30'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='101bd6458f9e86606ec857cef843b75286082da8'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert all(p.startswith('.github/owner-batch/') or p=='.github/workflows/owner-batch-verify.yml' for p in changed)
          directory=Path(os.environ['RUNNER_TEMP'])/('epivra-owner-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          directory.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream: stream.write('OWNER_CHECK_ROOT='+str(directory)+'\n')
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          rows=[]
          for patch in sorted(Path('.github/owner-batch').glob('*.json')): rows.extend(json.loads(patch.read_text(encoding='utf-8')))
          assert len(rows)==20 and len({r['path'] for r in rows})==20
          manifest={}
          for row in rows:
              path=Path(row['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('src','tests','tools','docs') or row['path']=='.github/development-state.json'
              old=subprocess.run(['git','show',base+':'+row['path']],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              assert (old.returncode==0)==(row['before'] is not None)
              raw=old.stdout if old.returncode==0 else b''
              assert row['before'] is None or blob(raw)==row['before'], row['path']+' original mismatch'
              lines=raw.decode('utf-8').splitlines(keepends=True)
              last=len(lines)
              for edit in reversed(row['edits']):
                  assert 0<=edit['start']<=edit['stop']<=last
                  lines[edit['start']:edit['stop']]=edit['text'].splitlines(keepends=True)
                  last=edit['start']
              data=''.join(lines).encode('utf-8')
              assert blob(data)==row['after'], row['path']+' candidate mismatch'
              if row['path']=='src/epivra/harness.py':
                  text=data.decode('utf-8')
                  old='receipt = self.store.get(study, draft["receipt"])'
                  assert text.count(old)==1
                  text=text.replace(old,'saved_receipt = self.store.get(study, draft["receipt"])')
                  old='draft_binding = {key: receipt.body[key]'
                  assert text.count(old)==1
                  data=text.replace(old,'draft_binding = {key: saved_receipt.body[key]').encode('utf-8')
                  assert blob(data)=='8a5674d43f76fe6e0b18c6ba44666f1c13d54d7b'
              if path.suffix=='.py': compile(data,str(path),'exec')
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              copy=directory/'files'/path
              copy.parent.mkdir(parents=True,exist_ok=True)
              copy.write_bytes(data)
              manifest[row['path']]=blob(data)
          (directory/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
      - name: Dependency-complete isolated validation without provider secrets
        id: gates
        shell: python
        run: |
          import os, subprocess, venv
          from pathlib import Path
          directory=Path(os.environ['OWNER_CHECK_ROOT'])
          venv.EnvBuilder(with_pip=True).create(directory/'env')
          python=str(directory/'env/Scripts/python.exe')
          with (directory/'install.log').open('wb') as log:
              subprocess.run([python,'-m','pip','install','.[mcp]','ruff','mypy','build'],stdout=log,stderr=subprocess.STDOUT,check=True,timeout=480)
          subprocess.run([python,'tools/dev_check.py','run','--profile','full','--output',str(directory/'evidence')],check=True)
          subprocess.run([python,'tools/dev_check.py','inspect','--output',str(directory/'evidence')],check=True)
      - name: Export validated ordinary blobs only
        if: steps.gates.outcome == 'success'
        shell: python
        env:
          BLOB_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          directory=Path(os.environ['OWNER_CHECK_ROOT'])
          manifest=json.loads((directory/'manifest.json').read_text(encoding='utf-8'))
          for name,expected in manifest.items():
              data=Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected
              request=urllib.request.Request('https://api.github.com/repos/studyzhige-ui/Epivra/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode('ascii')}).encode(),headers={'Authorization':'Bearer '+os.environ['BLOB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)['sha']
              assert actual==expected
          (directory/'validated-blobs.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.OWNER_CHECK_ROOT != ''
        with:
          name: continuous-owner-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OWNER_CHECK_ROOT }}/manifest.json
            ${{ env.OWNER_CHECK_ROOT }}/validated-blobs.json
            ${{ env.OWNER_CHECK_ROOT }}/install.log
            ${{ env.OWNER_CHECK_ROOT }}/evidence/
            ${{ env.OWNER_CHECK_ROOT }}/files/
          retention-days: 14
          if-no-files-found: warn
      - name: Cleanup this job's isolated temporary files
        if: always() && env.OWNER_CHECK_ROOT != ''
        shell: python
        run: |
          import os, shutil
          shutil.rmtree(os.environ['OWNER_CHECK_ROOT'],ignore_errors=True)
