name: Verify complete research workspace refactor
on:
  push:
    branches: [improve/epivra-optimization]
    paths: [.github/workflows/workspace-verify.yml]
permissions:
  contents: write
concurrency:
  group: workspace-refactor-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/improve/epivra-optimization'
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Materialize audited complete worktree
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          base='614ca1ca764e8c2926a50dd57a7def1c199b66ec'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==base
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert all(p.startswith('.github/refactor-batch/') or p=='.github/workflows/workspace-verify.yml' for p in paths)
          directory=Path(os.environ['RUNNER_TEMP'])/('epivra-workspace-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          directory.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream: stream.write('WORKSPACE_CHECK_ROOT='+str(directory)+'\n')
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          rows=[]
          for path in sorted(Path('.github/refactor-batch').glob('*.json')): rows.extend(json.loads(path.read_text(encoding='utf-8')))
          assert len(rows)==31 and len({r['path'] for r in rows})==31
          prepared=[]
          for row in rows:
              path=Path(row['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('src','tests','tools','docs') or row['path'] in ('.gitignore','README.md','README.zh-CN.md','pyproject.toml')
              old=subprocess.run(['git','show',base+':'+row['path']],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              assert (old.returncode==0)==(row['before'] is not None)
              data=old.stdout if old.returncode==0 else b''
              assert row['before'] is None or blob(data)==row['before'],row['path']+' original'
              lines=data.decode('utf-8').splitlines(keepends=True)
              last=len(lines)
              for edit in reversed(row['edits']):
                  assert 0<=edit['start']<=edit['stop']<=last
                  lines[edit['start']:edit['stop']]=edit['text'].splitlines(keepends=True)
                  last=edit['start']
              data=''.join(lines).encode('utf-8')
              assert blob(data)==row['after'],row['path']+' candidate'
              if path.suffix=='.py': compile(data,str(path),'exec')
              prepared.append((path,data))
          data=subprocess.check_output(['git','show','HEAD:.github/refactor-batch/files/test_research_workspace.py'])
          assert blob(data)=='de9f9cd733fadc1a5765d52f4f651427d36042fb'
          prepared.append((Path('tests/test_research_workspace.py'),data))
          for path,data in prepared:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          (directory/'inputs.json').write_text(json.dumps({str(p).replace('\\','/'):blob(d) for p,d in prepared},indent=2),encoding='utf-8')
      - name: Format touched Python without changing its AST
        shell: python
        run: |
          import ast, json, os, subprocess, venv
          from pathlib import Path
          directory=Path(os.environ['WORKSPACE_CHECK_ROOT'])
          venv.EnvBuilder(with_pip=True).create(directory/'env')
          python=str(directory/'env/Scripts/python.exe')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream: stream.write('WORKSPACE_PYTHON='+python+'\n')
          with (directory/'install.log').open('wb') as log:
              subprocess.run([python,'-m','pip','install','.[mcp]','ruff','mypy','build'],stdout=log,stderr=subprocess.STDOUT,check=True,timeout=480)
          paths=[p for p in json.loads((directory/'inputs.json').read_text()) if p.endswith('.py')]
          prior={p:ast.dump(ast.parse(Path(p).read_text(encoding='utf-8')),include_attributes=False) for p in paths}
          with (directory/'format.log').open('wb') as log:
              subprocess.run([python,'-m','ruff','format',*paths],stdout=log,stderr=subprocess.STDOUT,check=True)
              assert all(prior[p]==ast.dump(ast.parse(Path(p).read_text(encoding='utf-8')),include_attributes=False) for p in paths)
              subprocess.run([python,'-m','ruff','check','--fix',*paths],stdout=log,stderr=subprocess.STDOUT,check=True)
      - name: Strict tests typing and build
        id: gates
        shell: python
        run: |
          import os, subprocess
          from pathlib import Path
          directory=Path(os.environ['WORKSPACE_CHECK_ROOT'])
          p=os.environ['WORKSPACE_PYTHON']
          subprocess.run([p,'tools/dev_check.py','run','--profile','full','--output',str(directory/'evidence')],check=True)
          subprocess.run([p,'tools/dev_check.py','inspect','--output',str(directory/'evidence')],check=True)
      - name: Verify wheel outside source checkout
        id: wheel
        shell: python
        run: |
          import os, subprocess, venv
          from pathlib import Path
          directory=Path(os.environ['WORKSPACE_CHECK_ROOT'])
          wheels=list(Path('dist').glob('epivra-*.whl'))
          assert len(wheels)==1
          venv.EnvBuilder(with_pip=True).create(directory/'clean')
          p=str(directory/'clean/Scripts/python.exe')
          with (directory/'clean-wheel.log').open('wb') as log:
              subprocess.run([p,'-m','pip','install',str(wheels[0].resolve())],stdout=log,stderr=subprocess.STDOUT,check=True,timeout=300)
              subprocess.run([p,'-m','pip','check'],cwd=directory,stdout=log,stderr=subprocess.STDOUT,check=True)
              subprocess.run([p,'-I','-c','from epivra.research import ResearchLedger; from epivra.writing import WritingWorkspace; from importlib.resources import files; assert files("epivra").joinpath("web/favicon.svg").is_file()'],cwd=directory,stdout=log,stderr=subprocess.STDOUT,check=True)
              subprocess.run([str(directory/'clean/Scripts/epivra.exe'),'--help'],cwd=directory,stdout=log,stderr=subprocess.STDOUT,check=True)
      - name: Export verified ordinary source blobs
        if: steps.gates.outcome == 'success' && steps.wheel.outcome == 'success'
        shell: python
        env:
          BLOB_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          directory=Path(os.environ['WORKSPACE_CHECK_ROOT'])
          result={}
          for name in json.loads((directory/'inputs.json').read_text(encoding='utf-8')):
              data=Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/studyzhige-ui/Epivra/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode('ascii')}).encode(),headers={'Authorization':'Bearer '+os.environ['BLOB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)['sha']
              assert actual==expected
              result[name]=actual
          (directory/'validated-blobs.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
      - name: Capture final candidate even on failed gate
        if: always() && env.WORKSPACE_CHECK_ROOT != ''
        shell: python
        run: |
          import os, json, subprocess
          from pathlib import Path
          directory=Path(os.environ['WORKSPACE_CHECK_ROOT'])
          if (directory/'inputs.json').exists():
              for name in json.loads((directory/'inputs.json').read_text(encoding='utf-8')):
                  target=directory/'files'/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(Path(name).read_bytes())
          (directory/'tracked.diff').write_bytes(subprocess.check_output(['git','diff','--','src','tests','tools','docs','pyproject.toml','README.md','README.zh-CN.md','.gitignore']))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.WORKSPACE_CHECK_ROOT != ''
        with:
          name: research-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORKSPACE_CHECK_ROOT }}/*.json
            ${{ env.WORKSPACE_CHECK_ROOT }}/*.log
            ${{ env.WORKSPACE_CHECK_ROOT }}/tracked.diff
            ${{ env.WORKSPACE_CHECK_ROOT }}/evidence/
            ${{ env.WORKSPACE_CHECK_ROOT }}/files/
          retention-days: 14
          if-no-files-found: warn
      - name: Clean isolated verification directory
        if: always() && env.WORKSPACE_CHECK_ROOT != ''
        shell: python
        run: |
          import os, shutil
          shutil.rmtree(os.environ['WORKSPACE_CHECK_ROOT'],ignore_errors=True)
