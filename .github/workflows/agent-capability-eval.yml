name: Agent capability comparison
on:
  push:
    branches: [improve/epivra-optimization]
    paths: [evals/agent-capability-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: small-live-eval-${{ github.repository }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6bcd5a2588cab7c4952525902e438ab78df5f7c0
          path: .baseline
          persist-credentials: false
      - name: Install and test without model credentials
        shell: python
        run: |
          import os, subprocess, sys, venv
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / ('epivra-capabilities-' + os.environ['GITHUB_RUN_ID'] + '-${{ matrix.arm }}')
          venv.EnvBuilder(with_pip=True).create(p)
          python = str(p / 'Scripts/python.exe')
          subprocess.run([python, '-m', 'pip', 'install', '.'], check=True)
          subprocess.run([python, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_agent_efficiency.py'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f: f.write('EVAL_PYTHON=' + python + '\n')
      - name: Run identical role tasks with autonomous tool selection
        shell: python
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: ${{ matrix.arm == 'baseline' && format('{0}/.baseline/src', github.workspace) || format('{0}/src', github.workspace) }}
        run: |
          import os, subprocess, sys
          result = subprocess.run([os.environ['EVAL_PYTHON'], 'tools/run_agent_capability_eval.py', '--arm', '${{ matrix.arm }}', '--run-id', 'gh-' + os.environ['GITHUB_RUN_ID']])
          sys.exit(result.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capabilities-${{ matrix.arm }}-${{ github.run_id }}
          path: artifacts/capabilities-${{ matrix.arm }}/
          retention-days: 30
          if-no-files-found: warn
      - name: Clean this job's isolated environment and private state
        if: always()
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          run = os.environ['GITHUB_RUN_ID']
          shutil.rmtree(Path(os.environ['RUNNER_TEMP']) / ('epivra-capabilities-' + run + '-${{ matrix.arm }}'), ignore_errors=True)
          shutil.rmtree(Path('.epivra') / ('capabilities-gh-' + run + '-${{ matrix.arm }}'), ignore_errors=True)
