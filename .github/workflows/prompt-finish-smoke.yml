name: Shared policy complete-task acceptance
on:
  push:
    branches: [improve/epivra-optimization]
    paths: [.github/workflows/prompt-finish-smoke.yml]
permissions:
  contents: read
concurrency:
  group: small-live-eval-${{ github.repository }}
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.ref == 'refs/heads/improve/epivra-optimization'
    runs-on: [self-hosted, Windows, X64, epivra-eval]
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install and verify contracts without provider credentials
        shell: python
        run: |
          import json, os, subprocess, venv
          from pathlib import Path
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1': raise ValueError('Inspect original paid attempt; no blind replay')
          d=Path(os.environ['RUNNER_TEMP'])/('epivra-policy-smoke-'+os.environ['GITHUB_RUN_ID'])
          d.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
              out.write('SMOKE_ROOT='+str(d)+'\n')
              out.write('SMOKE_PYTHON='+str(d/'env/Scripts/python.exe')+'\n')
          venv.EnvBuilder(with_pip=True).create(d/'env')
          p=str(d/'env/Scripts/python.exe')
          subprocess.run([p,'-m','pip','install','.'],check=True,timeout=300)
          subprocess.run([p,'-m','unittest','discover','-s','tests','-p','test_prompt_finish.py'],check=True)
          request=Path('evals/refactor-smoke-request.json')
          if request.exists(): raise ValueError('unexpected active request')
          request.write_text(json.dumps({'version':1,'request_id':'continuous-workspace-20260921-01'}),encoding='utf-8')
      - name: One real complete task with unchanged materials and model settings
        shell: python
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          import os, subprocess, sys
          p=subprocess.run([os.environ['SMOKE_PYTHON'],'tools/run_refactor_smoke.py','--run-id','gh-'+os.environ['GITHUB_RUN_ID']+'-prompt-finish'])
          sys.exit(p.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-policy-smoke-${{ github.run_id }}
          path: artifacts/workspace-smoke/
          retention-days: 30
          if-no-files-found: warn
      - name: Remove only this test's private state and temporary environment
        if: always()
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          run=os.environ['GITHUB_RUN_ID']
          shutil.rmtree(Path('.epivra')/('workspace-smoke-gh-'+run+'-prompt-finish'),ignore_errors=True)
          Path('evals/refactor-smoke-request.json').unlink(missing_ok=True)
          if os.environ.get('SMOKE_ROOT'): shutil.rmtree(os.environ['SMOKE_ROOT'],ignore_errors=True)
