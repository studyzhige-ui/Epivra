[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epivra"
version = "0.2.0.dev0"
description = "Epivra: a local autonomous research workbench."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["httpx>=0.27,<1", "pypdf>=6,<7", "openpyxl>=3.1,<4", "questionary>=2,<3", "rich>=13,<16", "markdown-it-py>=3,<5", "python-docx>=1.2,<2"]

[project.optional-dependencies]
documents = ["docling>=2.126,<3", "onnxruntime>=1.23,<2"]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
epivra = "epivra.cli:main"
epivra-mcp = "epivra.mcp_server:main"
epivra-web = "epivra.webui:main"

[tool.setuptools.package-data]
epivra = ["web/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/epivra/domain.py", "src/epivra/review.py", "src/epivra/storage.py", "src/epivra/harness.py", "src/epivra/research.py", "src/epivra/writing.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
