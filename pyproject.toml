[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.2.0.dev0"
description = "A provider-neutral research Agent runtime."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["httpx>=0.27,<1", "pypdf>=6,<7", "openpyxl>=3.1,<4", "questionary>=2,<3", "rich>=13,<16"]

[project.optional-dependencies]
documents = ["docling>=2.126,<3", "onnxruntime>=1.23,<2"]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
deep-research = "deep_research_agent.cli:main"
deep-research-mcp = "deep_research_agent.mcp_server:main"
deep-research-web = "deep_research_agent.webui:main"

[tool.setuptools.package-data]
deep_research_agent = ["web/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
