[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "An agent-led deep research system with deterministic trust boundaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11,<4",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "pypdf>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.data-files]
"share/deep-research-agent/guides/domain/artificial-intelligence" = [
    "guides/domain/artificial-intelligence/GUIDE.md",
]
"share/deep-research-agent/guides/capability/systematic-evidence-synthesis" = [
    "guides/capability/systematic-evidence-synthesis/GUIDE.md",
]
