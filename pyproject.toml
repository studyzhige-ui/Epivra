[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent"
version = "0.1.0"
description = "An agent-led deep research system with deterministic trust boundaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11,<4",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "pypdf>=5,<7",
    # Interactive workspace only.  Rich renders the plan and the report; questionary
    # (over prompt_toolkit) provides arrow-key selection and hidden credential
    # entry.  Both are confined to deep_research_agent.cli -- the research engine
    # imports neither, so a headless deployment is unaffected by them.
    "rich>=13,<15",
    "questionary>=2,<3",
]

[project.scripts]
# Human workspace plus a local STDIO adapter for Agent hosts.
deep-research = "deep_research_agent.cli.main:main"
deep-research-mcp = "deep_research_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
